name: build

on:
  schedule:
    - cron: "10 3,10,13 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Check remote version
        id: precheck
        env:
          CZDB_DOWNLOAD_TOKEN: ${{ secrets.CZDB_DOWNLOAD_TOKEN }}
        run: |
          # 先调用官方接口拿最新版本号，与本地 ./version 比对，命中则直接跳过后续所有步骤
          remote_raw=$(curl -fsS --max-time 15 "https://cz88.net/api/communityIpVersions/getLatestVersion?key=${CZDB_DOWNLOAD_TOKEN}" | jq -r '.data // empty' || true)
          local_version=$(tr -d '[:space:]' < version 2>/dev/null || true)
          if [ -n "$remote_raw" ]; then
            # v20260617 -> 2026-06-17
            remote_version=$(echo "$remote_raw" | sed -E 's/^v?([0-9]{4})([0-9]{2})([0-9]{2})$/\1-\2-\3/')
            echo "remote=$remote_version local=$local_version"
            if [ "$remote_version" = "$local_version" ]; then
              echo "Remote version equals local, skip whole job"
              echo "SKIP=true" >> $GITHUB_ENV
            fi
          else
            echo "Remote version API unavailable, fallback to full build"
          fi
      - name: Parse
        if: env.SKIP != 'true'
        env:
          CZDB_DOWNLOAD_TOKEN: ${{ secrets.CZDB_DOWNLOAD_TOKEN }}
          CZDB_TOKEN: ${{ secrets.CZDB_TOKEN }}
        run: |
          pnpm install
          ./build.sh
      - name: Check if tag exists
        if: env.SKIP != 'true'
        run: |
          dat_date=$(cat version)
          echo "dat_date=${dat_date}" >> $GITHUB_ENV
          echo "Value of dat_date: ${dat_date}"
          # 只查询远端这一个 tag，开销与历史 tag 数量无关，比 git fetch --tags 快很多
          if git ls-remote --exit-code --tags origin "refs/tags/${dat_date}" >/dev/null 2>&1; then
            echo "Tag already exists, skipping create release"
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          fi
          # build.sh 在版本未变化时不会生成 stand 产物，后续步骤一并跳过
          if [ ! -f ./build/stand/qqwry.ipdb ]; then
            echo "No new build artifact, skipping subsequent steps"
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          fi
      - name: Calculate file hash value
        id: calculate_hash_value
        if: env.SKIP != 'true' && env.TAG_EXISTS != 'true'
        run: |
          echo "RAW_FILE_HASH=$(sha256sum ./build/raw/qqwry-raw.ipdb | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "STAND_FILE_HASH=$(sha256sum ./build/stand/qqwry.ipdb | awk '{ print $1 }')" >> $GITHUB_ENV
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        if: env.SKIP != 'true' && env.TAG_EXISTS != 'true'
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.dat_date }}
          token: ${{ secrets.QQWRYIPDB }}
          artifacts: build/raw/qqwry-raw.ipdb,build/stand/qqwry.ipdb
          draft: false
          prerelease: false
          makeLatest: true
          body: |
           #### ipdb File Info

           | Name               | Value                      |
           | :----------------: | :------------------------: |
           | Stand File Download: | https://cdn.1008.site/gh/nmgliangwei/qqwry.ipdb@main/qqwry.ipdb |
           | Stand File sha256: | qqwry.ipdb: ${{ env.STAND_FILE_HASH }} |
           | Raw File Download: | https://cdn.1008.site/gh/nmgliangwei/qqwry.ipdb@main/qqwry-raw.ipdb            |
           | Raw File sha256: | qqwry-raw.ipdb: ${{ env.RAW_FILE_HASH }} |
           <p align="right"><code>Version: ${{ env.dat_date }} </code></p>
      - name: Calculate repository hash value
        id: calculate_repo_hash_value
        if: env.SKIP != 'true' && env.TAG_EXISTS != 'true'
        run: |
          echo "STAND_REPO_HASH=$(git show main:qqwry.ipdb | sha256sum | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "RAW_REPO_HASH=$(git show main:qqwry-raw.ipdb | sha256sum | awk '{ print $1 }')" >> $GITHUB_ENV
      - name: Check for changes in qqwry.ipdb
        id: check
        if: env.SKIP != 'true' && env.TAG_EXISTS != 'true'
        run: |
          if [ ! -f qqwry.ipdb ] || [ ! -f qqwry-raw.ipdb ]; then
            echo "File does not exist"
            echo "RUN_NEXT_STEP=true" >> $GITHUB_ENV
          else
            #比较上面的两个hash值是否相等
            if [ "${{ env.RAW_FILE_HASH }}" != "${{ env.RAW_REPO_HASH }}" ] || [ "${{ env.STAND_FILE_HASH }}" != "${{ env.STAND_REPO_HASH }}" ]; then
              echo "File has changed"
              echo "RUN_NEXT_STEP=true" >> $GITHUB_ENV
            else
              echo "File has not changed"
            fi
          fi
      - name: Commit qqwry.ipdb
        if: env.SKIP != 'true' && env.RUN_NEXT_STEP == 'true' && env.TAG_EXISTS != 'true'
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          git config --global user.name $GIT_USERNAME
          git config --global user.email $GIT_EMAIL
          if ! git status -s | grep qqwry.ipdb --quiet ; then
            mv ./build/raw/qqwry-raw.ipdb qqwry-raw.ipdb
            mv ./build/stand/qqwry.ipdb qqwry.ipdb
            git add qqwry.ipdb qqwry-raw.ipdb version
            git commit -m "Update ipdb File in  ${{ env.dat_date }}"
            git push
          fi
